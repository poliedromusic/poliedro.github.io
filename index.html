<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poliédro</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .hero {
      margin-bottom: 28px;
    }

    .album-art {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 0 40px rgba(255, 255, 255, 0.08),
        0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .subtitle {
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
    }

    .main-card {
      margin-top: 16px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      color: #fff;
      cursor: pointer;

      background: linear-gradient(
        135deg,
        rgba(120, 80, 255, 0.05),
        rgba(0, 180, 255, 0.03)
      );

      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(6px);

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(120, 80, 255, 0.08);

      transition: transform 0.25s ease;
    }

    .main-card:hover {
      transform: translateY(-2px);
    }

    .card-art {
      width: 112px;
      height: 112px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-label {
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
    }

    .platforms-wrapper {
      position: relative;
      z-index: 2;
    }

    .platforms {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .platforms.active {
      max-height: 300px;
    }

    .platform-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      background: #111111;
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      z-index: 3;
      transition: all 0.25s ease;
    }

    .platform-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* HOVER COLORS */
    .platform-btn.spotify:hover {
      border-color: #1DB954;
      box-shadow: 0 0 12px rgba(29,185,84,0.4);
    }

    .platform-btn.youtube:hover {
      border-color: #FF0000;
      box-shadow: 0 0 12px rgba(255,0,0,0.4);
    }

    .platform-btn.apple:hover {
      border-color: #ff2d55;
      box-shadow: 0 0 12px rgba(255,45,85,0.4);
    }

    .platform-btn:hover {
      background: #1a1a1a;
      transform: scale(0.995);
    }

    .show-card {
      justify-content: center;
      text-align: center;
      text-decoration: none;
      display: none !important;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 30px 0 32px;
    }

    .social {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;

      background: linear-gradient(
        135deg,
        rgba(120, 80, 255, 0.05),
        rgba(0, 180, 255, 0.03)
      );

      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(6px);

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(120, 80, 255, 0.08);

      transition: transform 0.25s ease;
    }

    .social:hover {
      transform: translateY(-3px) scale(1.05);
    }

    .social img,
    .social svg {
      width: 22px;
      height: 22px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="hero">
      <img src="https://i.ibb.co/Hf5S82qv/1000276527.png" class="album-art">
      <p class="subtitle">Banda de rock • Goiânia</p>
    </div>

    <div class="main-card" onclick="togglePlatforms()">
      <img src="https://i.ibb.co/TBDsbKhT/1000276532.png" class="card-art">
      <div>
        <div class="card-label">OUÇA JÁ</div>
        <div class="card-title">Ao Vivo no CCUFG</div>
      </div>
    </div>

    <div class="platforms-wrapper">
      <div id="platforms" class="platforms">
        
        <a href="https://linktw.in/FXntXA" target="_blank" class="platform-btn spotify">

          </svg>
          Spotify
        </a>

        <a href="https://linktw.in/jgnPys" target="_blank" class="platform-btn youtube">
          <svg viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          YouTube
        </a>

        <a href="https://linktw.in/CgaqGw" target="_blank" class="platform-btn apple">
          <svg viewBox="0 0 24 24">
            <path d="M19.345 3.125a.75.75 0 0 0-.913-.553L9.683 5.093A3 3 0 0 0 7.5 7.983v7.411A3.251 3.251 0 0 0 6.25 15c-1.795 0-3.25 1.455-3.25 3.25S4.455 21.5 6.25 21.5 9.5 20.045 9.5 18.25V9.458l8-2.285v5.222a3.251 3.251 0 0 0-1.25-.395c-1.795 0-3.25 1.455-3.25 3.25s1.455 3.25 3.25 3.25 3.25-1.455 3.25-3.25V3.805a.75.75 0 0 0-.155-.68z"/>
          </svg>
          Apple Music
        </a>

      </div>
    </div>

    <a href="https://www.instagram.com/p/DXDJafJDkHA/" target="_blank" class="main-card show-card">
      <div>
        <div class="card-label">PRÓXIMO SHOW</div>
        <div class="card-title">29/04 - Goiânia</div>
      </div>
    </a>

    <div class="socials">
      <a href="https://linktw.in/SsXshp" target="_blank" class="social">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Instagram_white.svg/1280px-Instagram_white.svg.png">
      </a>

      <a href="https://linktw.in/ZbSaoz" target="_blank" class="social">
        <svg viewBox="0 0 24 24">
          <path fill="#fff" d="M16 3c.5 2.6 2.5 4.6 5 5v3c-1.8 0-3.5-.6-5-1.7V16a6 6 0 11-6-6c.3 0 .7 0 1 .1v3.1a3 3 0 10 2 2.8V3h3z"/>
        </svg>
      </a>

      <a href="https://linktw.in/CWNcMy" target="_blank" class="social">
        <svg viewBox="0 0 34 44">
          <path fill="#fff" d="M21.6 7.2s-.2-1.5-.8-2.1c-.7-.8-1.5-.8-1.9-.9C16.2 4 12 4 12 4s-4.2 0-6.9.2c-.4 0-1.2 0-1.9.9-.6.6-.8 2.1-.8 2.1S2 9 2 10.8v1.4C2 14 2.4 16 2.4 16s.2 1.5.8 2.1c.7.8 1.7.8 2.1.9 1.5.1 6.7.2 6.7.2s4.2 0 6.9-.2c.4 0 1.2 0 1.9-.9.6-.6.8-2.1.8-2.1s.4-2 .4-3.8v-1.4c0-1.8-.4-3.6-.4-3.6zM9.8 15.3V8.7l6.4 3.3-6.4 3.3z"/>
        </svg>
      </a>
    </div>

  </div>

  <script>
    function togglePlatforms() {
      document.getElementById('platforms').classList.toggle('active');
    }
  </script>

</body>
</html>
